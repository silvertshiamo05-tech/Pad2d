name: Pad2D
options:
  bundleIdPrefix: com.pad2d
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Inochi2DKit:
    path: Packages/Inochi2DKit
targets:
  Pad2D:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources/Assets.xcassets
      - path: App/Resources/Models
        type: folder
        optional: true
    dependencies:
      - package: Inochi2DKit
      - sdk: ARKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pad2d.player
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        SWIFT_OPTIMIZATION_LEVEL: "-O"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Pad2D
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        NSCameraUsageDescription: Pad2D uses the front camera to track your face so your model can copy your expressions. Video never leaves your iPad.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Inochi2D Puppet
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.inochi2d.inp, com.inochi2d.inx]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.inochi2d.inp
            UTTypeDescription: Inochi2D Puppet
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [inp]
          - UTTypeIdentifier: com.inochi2d.inx
            UTTypeDescription: Inochi Creator Project
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [inx]
